<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login - UHS GAHIRI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
}

.login-box {
    width: 90%;
    max-width: 380px;
    background: white;
    margin: 80px auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #bbb;
    box-sizing: border-box;
}

h1 {
    text-align: center;
    color: #0757a0;
}

p {
    text-align: center;
    color: #555;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 7px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: #0757a0;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #0757a0;
    text-decoration: none;
}

.error {
    display: none;
    margin-top: 15px;
    padding: 10px;
    background: #f8d7da;
    color: #721c24;
    border-radius: 6px;
    text-align: center;
}
</style>
</head>

<body>

<div class="login-box">

<h1>UHS GAHIRI</h1>

<p>🎓 Student Login</p>

<form id="loginForm">

<label>Student ID</label>

<input
type="text"
id="studentId"
placeholder="Enter Student ID"
required
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter Password"
required
>

<button type="submit">
🔐 Login
</button>

</form>

<div class="error" id="error">
❌ Student ID या Password गलत है!
</div>

<a class="back" href="index.html">
← Back to Home
</a>

</div>

<script>

document.getElementById("loginForm").addEventListener(
"submit",
function(event) {

event.preventDefault();

let id =
document.getElementById("studentId").value.trim();

let password =
document.getElementById("password").value;

if (id === "student" && password === "1234") {

localStorage.setItem("studentLoggedIn", "true");

localStorage.setItem("studentID", id);

alert("Login Successful! ✅");

window.location.href = "dashboard.html";

} else {

document.getElementById("error").style.display =
"block";

}

});

</script>

</body>
</html>
