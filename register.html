<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - My Digital Service</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

.box {
    max-width: 400px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px #ddd;
}

h2 {
    text-align: center;
}

input, button {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    box-sizing: border-box;
    border-radius: 7px;
}

input {
    border: 1px solid #ddd;
}

button {
    border: 0;
    background: #1769e0;
    color: white;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="box">

<h2>Create Account</h2>

<input type="text" placeholder="Full Name">
<input type="email" placeholder="Email">
<input type="password" placeholder="Create Password">

<button onclick="alert('Demo registration complete!')">
Register
</button>

</div>

</body>
</html>
