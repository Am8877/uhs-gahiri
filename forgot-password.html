<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password - UHS GAHIRI</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef5ff;
}

.box{
    width:90%;
    max-width:400px;
    margin:50px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 15px #bbb;
    box-sizing:border-box;
}

h1,h2{
    text-align:center;
    color:#0757a0;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    margin-top:7px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:18px;
    background:#0757a0;
    color:white;
    border:0;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
}

.step{
    display:none;
}

#step1{
    display:block;
}

.message{
    margin-top:15px;
    padding:10px;
    border-radius:7px;
    text-align:center;
    display:none;
    font-weight:bold;
}

.error{
    background:#f8d7da;
    color:#721c24;
}

.success{
    background:#d4edda;
    color:#155724;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#0757a0;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<h1>UHS GAHIRI</h1>

<!-- STEP 1 -->

<div id="step1" class="step">

<h2>🔐 Forgot Password</h2>

<p style="text-align:center;">
Registered mobile number पर OTP भेजें
</p>

<label>Student ID</label>

<input
type="text"
id="studentId"
placeholder="Enter Student ID"
>

<label>Mobile Number</label>

<input
type="tel"
id="mobile"
placeholder="Enter 10 digit mobile number"
maxlength="10"
>

<button onclick="sendOTP()">
📱 Send OTP
</button>

</div>


<!-- STEP 2 -->

<div id="step2" class="step">

<h2>🔢 Verify OTP</h2>

<p style="text-align:center;">
आपके registered mobile पर OTP भेजा गया है।
</p>

<label>OTP</label>

<input
type="number"
id="otp"
placeholder="Enter 6 digit OTP"
maxlength="6"
>

<button onclick="verifyOTP()">
✅ Verify OTP
</button>

</div>


<!-- STEP 3 -->

<div id="step3" class="step">

<h2>🔑 New Password</h2>

<label>New Password</label>

<input
type="password"
id="newPassword"
placeholder="Enter New Password"
>

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm New Password"
>

<button onclick="changePassword()">
🔐 Change Password
</button>

</div>


<div class="message error" id="error"></div>

<div class="message success" id="success"></div>

<a class="back" href="login.html">
← Back to Student Login
</a>

</div>


<script>

/*
IMPORTANT:
यह अभी FRONTEND DEMO है।

असली SMS OTP के लिए
Google Apps Script + SMS API
connect करना होगा।
*/


let generatedOTP = "";

let verifiedStudent = null;


/* ================= SEND OTP ================= */

function sendOTP(){

    let id =
        document.getElementById(
            "studentId"
        ).value.trim();

    let mobile =
        document.getElementById(
            "mobile"
        ).value.trim();


    hideMessages();


    if(!id){

        showError(
            "❌ Student ID डालें।"
        );

        return;
    }


    if(!/^[0-9]{10}$/.test(mobile)){

        showError(
            "❌ सही 10 digit mobile number डालें।"
        );

        return;
    }


    let students =
        JSON.parse(
            localStorage.getItem(
                "students"
            )
        ) || [];


    let student =
        students.find(function(item){

            return(
                item.studentId === id &&
                item.mobile === mobile
            );

        });


    if(!student){

        showError(
            "❌ Student ID और Mobile Number match नहीं कर रहा।"
        );

        return;
    }


    verifiedStudent = student;


    /*
    TEMPORARY OTP

    बाद में यहाँ SMS API लगाया जाएगा।
    */

    generatedOTP =
        Math.floor(
            100000 +
            Math.random() * 900000
        ).toString();


    alert(
        "DEMO OTP: " +
        generatedOTP
    );


    document.getElementById(
        "step1"
    ).style.display="none";


    document.getElementById(
        "step2"
    ).style.display="block";


    showSuccess(
        "OTP भेज दिया गया।"
    );

}


/* ================= VERIFY OTP ================= */

function verifyOTP(){

    let otp =
        document.getElementById(
            "otp"
        ).value.trim();


    hideMessages();


    if(otp !== generatedOTP){

        showError(
            "❌ OTP गलत है।"
        );

        return;
    }


    document.getElementById(
        "step2"
    ).style.display="none";


    document.getElementById(
        "step3"
    ).style.display="block";


    showSuccess(
        "✅ OTP Verified!"
    );

}


/* ================= CHANGE PASSWORD ================= */

function changePassword(){

    let password =
        document.getElementById(
            "newPassword"
        ).value;

    let confirm =
        document.getElementById(
            "confirmPassword"
        ).value;


    hideMessages();


    if(password.length < 6){

        showError(
            "❌ Password कम से कम 6 characters का रखें।"
        );

        return;
    }


    if(password !== confirm){

        showError(
            "❌ Password match नहीं कर रहा।"
        );

        return;
    }


    let students =
        JSON.parse(
            localStorage.getItem(
                "students"
            )
        ) || [];


    let index =
        students.findIndex(function(item){

            return(
                item.studentId ===
                verifiedStudent.studentId
            );

        });


    if(index === -1){

        showError(
            "❌ Student account नहीं मिला।"
        );

        return;
    }


    students[index].password =
        password;


    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );


    showSuccess(
        "✅ Password Successfully Changed!"
    );


    setTimeout(function(){

        window.location.href =
            "login.html";

    },2000);

}


/* ================= MESSAGE ================= */

function showError(text){

    let box =
        document.getElementById(
            "error"
        );

    box.innerText=text;

    box.style.display="block";

}


function showSuccess(text){

    let box =
        document.getElementById(
            "success"
        );

    box.innerText=text;

    box.style.display="block";

}


function hideMessages(){

    document.getElementById(
        "error"
    ).style.display="none";

    document.getElementById(
        "success"
    ).style.display="none";

}

</script>

</body>
</html>
