<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Result Management - UHS GAHIRI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
}

header {
    background: #333;
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: 25px auto;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 18px;
    border-radius: 12px;
    box-shadow: 0 3px 10px #ccc;
}

h2 {
    color: #0757a0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    background: #0757a0;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
}

.delete {
    background: #d32f2f;
}

.result {
    border-left: 5px solid #0757a0;
    margin-top: 12px;
}

.empty {
    text-align: center;
    color: #777;
}

.back {
    display: block;
    width: 230px;
    margin: 25px auto;
    padding: 12px;
    background: #333;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>UHS GAHIRI</h1>
    <p>📝 Result Management</p>
</header>

<div class="container">

<div class="card">

<h2>➕ Add Student Result</h2>

<form id="resultForm">

<label>Student ID</label>

<input
type="text"
id="studentId"
placeholder="Example: UHS001"
required
>

<label>Subject</label>

<input
type="text"
id="subject"
placeholder="Example: Physics"
required
>

<label>Marks Obtained</label>

<input
type="number"
id="marks"
placeholder="Example: 85"
min="0"
max="100"
required
>

<button type="submit">
💾 Save Result
</button>

</form>

</div>


<div class="card">

<h2>📋 Saved Results</h2>

<div id="resultList"></div>

</div>

</div>


<a class="back" href="admin-dashboard.html">
← Back to Principal Dashboard
</a>


<script>

/* ADMIN CHECK */

if (
    localStorage.getItem("adminLoggedIn")
    !== "true"
) {

    alert("Please Principal Login karein.");

    window.location.href =
        "admin-login.html";
}


/* LOAD RESULTS */

function loadResults() {

    let results =
        JSON.parse(
            localStorage.getItem(
                "studentResults"
            )
        ) || [];

    let list =
        document.getElementById(
            "resultList"
        );

    list.innerHTML = "";


    if (results.length === 0) {

        list.innerHTML = `
            <div class="empty">
                📝 अभी कोई result नहीं है।
            </div>
        `;

        return;
    }


    results.forEach(function(item, index) {

        let div =
            document.createElement("div");

        div.className =
            "card result";

        div.innerHTML = `

            <b>
                👨‍🎓 Student ID:
                ${item.studentId}
            </b>

            <p>
                📚 Subject:
                <b>${item.subject}</b>
            </p>

            <p>
                📝 Marks:
                <b>${item.marks}/100</b>
            </p>

            <button
                class="delete"
                onclick="deleteResult(${index})">

                🗑️ Delete

            </button>
        `;

        list.appendChild(div);

    });
}


/* SAVE RESULT */

document.getElementById(
    "resultForm"
).addEventListener(
"submit",
function(event) {

    event.preventDefault();

    let studentId =
        document.getElementById(
            "studentId"
        ).value.trim();

    let subject =
        document.getElementById(
            "subject"
        ).value.trim();

    let marks =
        Number(
            document.getElementById(
                "marks"
            ).value
        );


    if (marks < 0 || marks > 100) {

        alert(
            "Marks 0 se 100 ke beech hone chahiye."
        );

        return;
    }


    let results =
        JSON.parse(
            localStorage.getItem(
                "studentResults"
            )
        ) || [];


    results.push({

        studentId: studentId,

        subject: subject,

        marks: marks

    });


    localStorage.setItem(
        "studentResults",
        JSON.stringify(results)
    );


    document.getElementById(
        "resultForm"
    ).reset();


    loadResults();


    alert(
        "Result Saved Successfully! ✅"
    );

});


/* DELETE RESULT */

function deleteResult(index) {

    if (
        !confirm(
            "Kya ye result delete karna hai?"
        )
    ) {
        return;
    }


    let results =
        JSON.parse(
            localStorage.getItem(
                "studentResults"
            )
        ) || [];


    results.splice(index, 1);


    localStorage.setItem(
        "studentResults",
        JSON.stringify(results)
    );


    loadResults();

}


loadResults();

</script>

</body>
</html>
