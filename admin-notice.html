<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notice Management - UHS GAHIRI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
}

header {
    background: #333;
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: 25px auto;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 18px;
    border-radius: 12px;
    box-shadow: 0 3px 10px #ccc;
}

h2 {
    color: #0757a0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-family: Arial;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    background: #0757a0;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
}

.delete {
    background: #d32f2f;
}

.notice {
    border-left: 5px solid #0757a0;
}

.notice-date {
    color: #777;
    font-size: 14px;
}

.empty {
    text-align: center;
    color: #777;
}

.back {
    display: block;
    width: 230px;
    margin: 25px auto;
    padding: 12px;
    background: #333;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>UHS GAHIRI</h1>
    <p>📢 Notice Management</p>
</header>

<div class="container">

    <div class="card">

        <h2>➕ Publish New Notice</h2>

        <form id="noticeForm">

            <label>Notice Title</label>

            <input
                type="text"
                id="noticeTitle"
                placeholder="Example: School Holiday"
                required
            >

            <label>Notice Details</label>

            <textarea
                id="noticeText"
                placeholder="Notice details likhein..."
                required
            ></textarea>

            <button type="submit">
                📢 Publish Notice
            </button>

        </form>

    </div>


    <div class="card">

        <h2>📋 Published Notices</h2>

        <div id="noticeList"></div>

    </div>

</div>


<a class="back" href="admin-dashboard.html">
    ← Back to Principal Dashboard
</a>


<script>

/* ================= ADMIN CHECK ================= */

if (
    localStorage.getItem("adminLoggedIn")
    !== "true"
) {

    alert("Please Principal Login karein.");

    window.location.href =
        "admin-login.html";

}


/* ================= LOAD NOTICES ================= */

function loadNotices() {

    let notices =
        JSON.parse(
            localStorage.getItem("schoolNotices")
        ) || [];

    let list =
        document.getElementById("noticeList");

    list.innerHTML = "";


    if (notices.length === 0) {

        list.innerHTML = `
            <div class="empty">
                📢 अभी कोई notice publish नहीं हुआ।
            </div>
        `;

        return;
    }


    notices.forEach(function(notice, index) {

        let div =
            document.createElement("div");

        div.className =
            "card notice";


        div.innerHTML = `

            <h3>
                📢 ${notice.title}
            </h3>

            <p>
                ${notice.text}
            </p>

            <p class="notice-date">
                📅 ${notice.date}
            </p>

            <button
                class="delete"
                onclick="deleteNotice(${index})">

                🗑️ Delete Notice

            </button>

        `;


        list.appendChild(div);

    });

}


/* ================= PUBLISH NOTICE ================= */

document.getElementById("noticeForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    let title =
        document.getElementById("noticeTitle")
        .value.trim();


    let text =
        document.getElementById("noticeText")
        .value.trim();


    let notices =
        JSON.parse(
            localStorage.getItem("schoolNotices")
        ) || [];


    notices.unshift({

        title: title,

        text: text,

        date: new Date()
            .toLocaleDateString("hi-IN")

    });


    localStorage.setItem(
        "schoolNotices",
        JSON.stringify(notices)
    );


    document.getElementById(
        "noticeForm"
    ).reset();


    loadNotices();


    alert("Notice Published! ✅");

});


/* ================= DELETE NOTICE ================= */

function deleteNotice(index) {

    if (
        !confirm(
            "Kya ye notice delete karna hai?"
        )
    ) {
        return;
    }


    let notices =
        JSON.parse(
            localStorage.getItem("schoolNotices")
        ) || [];


    notices.splice(index, 1);


    localStorage.setItem(
        "schoolNotices",
        JSON.stringify(notices)
    );


    loadNotices();

}


/* ================= START ================= */

loadNotices();

</script>

</body>
</html>
