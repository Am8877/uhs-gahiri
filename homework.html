<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Homework - UHS GAHIRI</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef5ff;
}

header{
    background:#0757a0;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    margin:0;
}

.container{
    width:94%;
    max-width:700px;
    margin:20px auto;
}

.info{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px #ccc;
    margin-bottom:20px;
}

.info h2{
    color:#0757a0;
    margin-top:0;
}

.homework{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:12px;
    box-shadow:0 3px 10px #ccc;
    border-left:5px solid #0757a0;
}

.homework h3{
    color:#0757a0;
    margin-top:0;
}

.date{
    color:#666;
    font-size:14px;
}

.teacher{
    color:#555;
}

.empty{
    background:white;
    padding:25px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 3px 10px #ccc;
}

.back{
    display:block;
    width:230px;
    margin:25px auto;
    padding:12px;
    background:#333;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:7px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>UHS GAHIRI</h1>
    <p>📚 My Homework</p>
</header>


<div class="container">

<div class="info">

    <h2>🎓 Student Information</h2>

    <p>
        Name:
        <b id="studentName">Student</b>
    </p>

    <p>
        Student ID:
        <b id="studentID">---</b>
    </p>

    <p>
        Class:
        <b id="studentClass">12th</b>
    </p>

    <p id="streamText">
        Stream:
        <b id="studentStream">Science</b>
    </p>

</div>


<h2 style="color:#0757a0;">
    📝 Homework
</h2>

<div id="homeworkList"></div>

</div>


<a class="back" href="dashboard.html">
← Back to Student Dashboard
</a>


<script>

/* ================= LOGIN CHECK ================= */

if(
    localStorage.getItem("studentLoggedIn")
    !== "true"
){

    alert("Please Student Login karein.");

    window.location.href="login.html";

}


/* ================= STUDENT DATA ================= */

let studentName =
    localStorage.getItem("studentName");

let studentID =
    localStorage.getItem("studentID");


if(studentName){

    document.getElementById(
        "studentName"
    ).innerText = studentName;

}


if(studentID){

    document.getElementById(
        "studentID"
    ).innerText = studentID;

}


/*
    अभी default Class 12 Science
    रखी गई है।
*/

let studentClass =
    localStorage.getItem("studentClass") || "12";

let studentStream =
    localStorage.getItem("studentStream") || "science";


document.getElementById(
    "studentClass"
).innerText =
    studentClass + "th";


/* ================= STREAM ================= */

if(
    studentClass === "11" ||
    studentClass === "12"
){

    document.getElementById(
        "studentStream"
    ).innerText =
        studentStream;

}else{

    document.getElementById(
        "streamText"
    ).style.display="none";

}


/* ================= LOAD HOMEWORK ================= */

function loadHomework(){

    let allHomework =
        JSON.parse(
            localStorage.getItem(
                "schoolHomework"
            )
        ) || [];


    let list =
        document.getElementById(
            "homeworkList"
        );


    list.innerHTML="";


    /* Filter */

    let homework =
        allHomework.filter(function(item){

            if(
                studentClass === "11" ||
                studentClass === "12"
            ){

                return(
                    item.className === studentClass &&
                    item.stream === studentStream
                );

            }else{

                return(
                    item.className === studentClass
                );

            }

        });


    /* No homework */

    if(homework.length === 0){

        list.innerHTML = `

            <div class="empty">

                📚 अभी आपकी Class के लिए
                कोई Homework नहीं है।

            </div>

        `;

        return;

    }


    /* Show homework */

    homework.forEach(function(item){

        let div =
            document.createElement("div");

        div.className="homework";


        div.innerHTML = `

            <h3>
                📚 ${item.subject}
            </h3>

            <p class="date">
                📅 Date: ${item.date}
            </p>

            <p>
                📝 <b>Homework:</b>
            </p>

            <p>
                ${item.text}
            </p>

            <p class="teacher">
                👨‍🏫 Teacher:
                <b>${item.teacherName}</b>
            </p>

        `;


        list.appendChild(div);

    });

}


/* ================= START ================= */

loadHomework();

</script>

</body>
</html>
