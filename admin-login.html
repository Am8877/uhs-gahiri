<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Principal Login - UHS GAHIRI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
}

.login-box {
    width: 90%;
    max-width: 380px;
    background: white;
    margin: 60px auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #bbb;
    box-sizing: border-box;
}

h1 {
    text-align: center;
    color: #333;
}

p {
    text-align: center;
    color: #555;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 7px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: #333;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.error {
    display: none;
    margin-top: 15px;
    padding: 10px;
    background: #f8d7da;
    color: #721c24;
    border-radius: 6px;
    text-align: center;
}

.success {
    display: none;
    margin-top: 15px;
    padding: 10px;
    background: #d4edda;
    color: #155724;
    border-radius: 6px;
    text-align: center;
}

.links {
    text-align: center;
    margin-top: 20px;
}

.links a {
    color: #0757a0;
    text-decoration: none;
    display: block;
    margin: 10px;
    font-weight: bold;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #0757a0;
    text-decoration: none;
}

/* POPUP */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
}

.modal-box {
    background: white;
    width: 90%;
    max-width: 380px;
    margin: 50px auto;
    padding: 25px;
    border-radius: 12px;
    box-sizing: border-box;
}

.modal-box h2 {
    text-align: center;
}

.close {
    float: right;
    font-size: 25px;
    cursor: pointer;
    color: red;
}
</style>
</head>

<body>

<div class="login-box">

<h1>UHS GAHIRI</h1>

<p>👨‍🏫 Principal Login</p>

<form id="adminForm">

<label>Principal ID</label>

<input
type="text"
id="adminId"
placeholder="Enter Principal ID"
required
>

<label>Password</label>

<input
type="password"
id="adminPassword"
placeholder="Enter Password"
required
>

<button type="submit">
🔐 Principal Login
</button>

</form>

<div class="error" id="error">
❌ Principal ID या Password गलत है!
</div>

<div class="links">

<a href="#" onclick="openForgot()">
🔑 Forgot Password?
</a>

<a href="#" onclick="openRegister()">
📝 New Principal Registration
</a>

</div>

<a class="back" href="index.html">
← Back to Home
</a>

</div>


<!-- ================= FORGOT PASSWORD ================= -->

<div class="modal" id="forgotModal">

<div class="modal-box">

<span class="close" onclick="closeForgot()">×</span>

<h2>🔑 Forgot Password</h2>

<p>Principal ID और Mobile Number डालें</p>

<label>Principal ID</label>

<input
type="text"
id="forgotId"
placeholder="Enter Principal ID"
>

<label>Mobile Number</label>

<input
type="tel"
id="forgotMobile"
placeholder="10 digit mobile number"
maxlength="10"
>

<button onclick="resetPassword()">
Reset Password
</button>

<div class="success" id="forgotSuccess"></div>

<div class="error" id="forgotError"></div>

</div>

</div>


<!-- ================= REGISTRATION ================= -->

<div class="modal" id="registerModal">

<div class="modal-box">

<span class="close" onclick="closeRegister()">×</span>

<h2>📝 Principal Registration</h2>

<label>Principal Name</label>

<input
type="text"
id="regName"
placeholder="Enter Principal Name"
>

<label>Principal ID</label>

<input
type="text"
id="regId"
placeholder="Create Principal ID"
>

<label>Mobile Number</label>

<input
type="tel"
id="regMobile"
placeholder="10 digit mobile number"
maxlength="10"
>

<label>Create Password</label>

<input
type="password"
id="regPassword"
placeholder="Create Password"
>

<button onclick="registerPrincipal()">
Create Principal Account
</button>

<div class="success" id="registerSuccess"></div>

<div class="error" id="registerError"></div>

</div>

</div>


<script>

/* ================= LOGIN ================= */

document.getElementById("adminForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    let id =
    document.getElementById("adminId").value.trim();

    let password =
    document.getElementById("adminPassword").value;

    let savedPrincipal =
    JSON.parse(localStorage.getItem("principalAccount"));

    let loginOK = false;

    /*
      Default Principal Login

      ID: principal
      Password: 1234
    */

    if (id === "principal" && password === "1234") {

        loginOK = true;

    }

    /*
      Registered Principal Login
    */

    if (
        savedPrincipal &&
        id === savedPrincipal.id &&
        password === savedPrincipal.password
    ) {

        loginOK = true;

    }


    if (loginOK) {

        localStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        alert("Principal Login Successful! ✅");

        window.location.href =
            "admin-dashboard.html";

    } else {

        document.getElementById("error")
        .style.display = "block";

    }

});


/* ================= FORGOT PASSWORD ================= */

function openForgot() {

    document.getElementById("forgotModal")
    .style.display = "block";

}

function closeForgot() {

    document.getElementById("forgotModal")
    .style.display = "none";

}


function resetPassword() {

    let id =
    document.getElementById("forgotId").value.trim();

    let mobile =
    document.getElementById("forgotMobile").value.trim();

    let account =
    JSON.parse(localStorage.getItem("principalAccount"));


    document.getElementById("forgotError")
    .style.display = "none";

    document.getElementById("forgotSuccess")
    .style.display = "none";


    if (!id || !mobile) {

        showForgotError(
            "❌ सभी जानकारी भरें!"
        );

        return;

    }


    if (!/^[0-9]{10}$/.test(mobile)) {

        showForgotError(
            "❌ Mobile Number 10 digit का होना चाहिए!"
        );

        return;

    }


    /*
      Registered account check
    */

    if (
        account &&
        id === account.id &&
        mobile === account.mobile
    ) {

        let newPassword =
        prompt(
            "अपना नया Password डालें:"
        );


        if (!newPassword) {

            return;

        }


        account.password =
        newPassword;

        localStorage.setItem(
            "principalAccount",
            JSON.stringify(account)
        );


        document.getElementById("forgotSuccess")
        .innerHTML =
        "✅ Password successfully बदल दिया गया! अब नए Password से Login करें।";

        document.getElementById("forgotSuccess")
        .style.display = "block";


    } else {

        /*
          Default account
        */

        if (
            id === "principal"
        ) {

            showForgotError(
                "⚠️ Default Principal account का password reset करने के लिए registration account बनाएं।"
            );

        } else {

            showForgotError(
                "❌ Principal ID या Mobile Number गलत है!"
            );

        }

    }

}


function showForgotError(message) {

    let error =
    document.getElementById("forgotError");

    error.innerHTML = message;

    error.style.display = "block";

}


/* ================= REGISTRATION ================= */

function openRegister() {

    document.getElementById("registerModal")
    .style.display = "block";

}


function closeRegister() {

    document.getElementById("registerModal")
    .style.display = "none";

}


function registerPrincipal() {

    let name =
    document.getElementById("regName").value.trim();

    let id =
    document.getElementById("regId").value.trim();

    let mobile =
    document.getElementById("regMobile").value.trim();

    let password =
    document.getElementById("regPassword").value;


    document.getElementById("registerError")
    .style.display = "none";

    document.getElementById("registerSuccess")
    .style.display = "none";


    if (
        !name ||
        !id ||
        !mobile ||
        !password
    ) {

        showRegisterError(
            "❌ सभी जानकारी भरें!"
        );

        return;

    }


    if (!/^[0-9]{10}$/.test(mobile)) {

        showRegisterError(
            "❌ Mobile Number 10 digit का होना चाहिए!"
        );

        return;

    }


    if (password.length < 4) {

        showRegisterError(
            "❌ Password कम से कम 4 characters का होना चाहिए!"
        );

        return;

    }


    let existing =
    JSON.parse(
        localStorage.getItem("principalAccount")
    );


    if (existing) {

        showRegisterError(
            "❌ Principal Account पहले से registered है!"
        );

        return;

    }


    let account = {

        name: name,

        id: id,

        mobile: mobile,

        password: password

    };


    localStorage.setItem(
        "principalAccount",
        JSON.stringify(account)
    );


    document.getElementById("registerSuccess")
    .innerHTML =
    "✅ Principal Registration Successful! अब Login कर सकते हैं।";

    document.getElementById("registerSuccess")
    .style.display = "block";


    setTimeout(function() {

        closeRegister();

    }, 2000);

}

function showRegisterError(message) {

    let error =
    document.getElementById("registerError");

    error.innerHTML = message;

    error.style.display = "block";

}

</script>

</body>
</html>
