<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Management - UHS GAHIRI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
}

header {
    background: #333;
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: 25px auto;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 18px;
    border-radius: 12px;
    box-shadow: 0 3px 10px #ccc;
}

h2 {
    color: #0757a0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    background: #0757a0;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
}

.delete {
    background: #d32f2f;
}

.teacher {
    border-left: 5px solid #0757a0;
}

.count {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.empty {
    text-align: center;
    color: #777;
}

.back {
    display: block;
    width: 230px;
    margin: 25px auto;
    padding: 12px;
    background: #333;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>UHS GAHIRI</h1>
    <p>👨‍🏫 Teacher Management</p>
</header>

<div class="container">

<div class="card">

<h2>➕ Add Teacher</h2>

<div class="count">
    Teachers:
    <span id="teacherCount">0</span>/20
</div>

<form id="teacherForm">

<label>Teacher Name</label>

<input
type="text"
id="teacherName"
placeholder="Enter Teacher Name"
required
>

<label>Teacher ID</label>

<input
type="text"
id="teacherId"
placeholder="Example: T001"
required
>

<label>Email</label>

<input
type="email"
id="teacherEmail"
placeholder="Teacher Email"
required
>

<label>Password</label>

<input
type="password"
id="teacherPassword"
placeholder="Create Password"
required
>

<button type="submit">
    👨‍🏫 Add Teacher
</button>

</form>

</div>


<div class="card">

<h2>👨‍🏫 Added Teachers</h2>

<div id="teacherList"></div>

</div>

</div>


<a class="back" href="admin-dashboard.html">
← Back to Principal Dashboard
</a>


<script>

/* ================= PRINCIPAL CHECK ================= */

if (
    localStorage.getItem("adminLoggedIn")
    !== "true"
) {

    alert("Please Principal Login karein.");

    window.location.href =
        "admin-login.html";
}


/* ================= LOAD TEACHERS ================= */

function loadTeachers() {

    let teachers =
        JSON.parse(
            localStorage.getItem(
                "schoolTeachers"
            )
        ) || [];


    document.getElementById(
        "teacherCount"
    ).innerText = teachers.length;


    let list =
        document.getElementById(
            "teacherList"
        );


    list.innerHTML = "";


    if (teachers.length === 0) {

        list.innerHTML = `
            <div class="empty">
                👨‍🏫 अभी कोई Teacher add नहीं है।
            </div>
        `;

        return;
    }


    teachers.forEach(function(teacher, index) {

        let div =
            document.createElement("div");

        div.className =
            "card teacher";


        div.innerHTML = `

            <h3>
                👨‍🏫 ${teacher.name}
            </h3>

            <p>
                🆔 Teacher ID:
                <b>${teacher.teacherId}</b>
            </p>

            <p>
                📧 Email:
                ${teacher.email}
            </p>

            <button
                class="delete"
                onclick="deleteTeacher(${index})">

                🗑️ Delete Teacher

            </button>

        `;


        list.appendChild(div);

    });

}


/* ================= ADD TEACHER ================= */

document.getElementById(
    "teacherForm"
).addEventListener(
"submit",
function(event) {

    event.preventDefault();


    let name =
        document.getElementById(
            "teacherName"
        ).value.trim();


    let teacherId =
        document.getElementById(
            "teacherId"
        ).value.trim();


    let email =
        document.getElementById(
            "teacherEmail"
        ).value.trim();


    let password =
        document.getElementById(
            "teacherPassword"
        ).value;


    let teachers =
        JSON.parse(
            localStorage.getItem(
                "schoolTeachers"
            )
        ) || [];


    /* MAX 20 */

    if (teachers.length >= 20) {

        alert(
            "❌ Maximum 20 Teachers hi add kiye ja sakte hain."
        );

        return;
    }


    /* DUPLICATE ID */

    let exists =
        teachers.find(function(teacher) {

            return (
                teacher.teacherId ===
                teacherId
            );

        });


    if (exists) {

        alert(
            "❌ Ye Teacher ID already registered hai."
        );

        return;
    }


    /* CREATE TEACHER */

    teachers.push({

        name: name,

        teacherId: teacherId,

        email: email,

        password: password

    });


    localStorage.setItem(
        "schoolTeachers",
        JSON.stringify(teachers)
    );


    document.getElementById(
        "teacherForm"
    ).reset();


    loadTeachers();


    alert(
        "Teacher Successfully Added! ✅"
    );

});


/* ================= DELETE TEACHER ================= */

function deleteTeacher(index) {

    if (
        !confirm(
            "Kya aap is Teacher ko delete karna chahte hain?"
        )
    ) {
        return;
    }


    let teachers =
        JSON.parse(
            localStorage.getItem(
                "schoolTeachers"
            )
        ) || [];


    teachers.splice(index, 1);


    localStorage.setItem(
        "schoolTeachers",
        JSON.stringify(teachers)
    );


    loadTeachers();

}


loadTeachers();

</script>

</body>
</html>
