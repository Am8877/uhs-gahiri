<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile - UHS GAHIRI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
}

header {
    background: #0757a0;
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    width: 92%;
    max-width: 600px;
    margin: 25px auto;
}

.profile {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 10px #ccc;
}

.photo-box {
    text-align: center;
    margin-bottom: 20px;
}

.profile-photo {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #0757a0;
    background: #eef5ff;
}

.photo-button {
    display: block;
    width: 200px;
    margin: 15px auto 5px;
    padding: 12px;
    background: #0757a0;
    color: white;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

#photoInput {
    display: none;
}

.remove-button {
    width: 200px;
    padding: 10px;
    margin-top: 8px;
    background: #d32f2f;
    color: white;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

h2 {
    text-align: center;
    color: #0757a0;
}

.info {
    border-bottom: 1px solid #ddd;
    padding: 14px 0;
}

.info:last-child {
    border-bottom: none;
}

.label {
    color: #777;
    font-size: 14px;
}

.value {
    font-size: 17px;
    font-weight: bold;
    margin-top: 4px;
    word-break: break-word;
}

.back {
    display: block;
    width: 200px;
    margin: 25px auto;
    padding: 12px;
    background: #0757a0;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>UHS GAHIRI</h1>
    <p>👤 My Profile</p>
</header>


<div class="container">

    <div class="profile">

        <!-- PROFILE PHOTO -->

        <div class="photo-box">

            <img
                id="profilePhoto"
                class="profile-photo"
                alt="Profile Picture"
            >

            <label
                for="photoInput"
                class="photo-button"
            >
                📷 Change Profile Picture
            </label>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
            >

            <button
                class="remove-button"
                onclick="removePhoto()"
            >
                🗑️ Remove Picture
            </button>

        </div>


        <h2 id="studentName">
            Student
        </h2>


        <div class="info">

            <div class="label">
                Student ID
            </div>

            <div
                class="value"
                id="studentID"
            >
                ---
            </div>

        </div>


        <div class="info">

            <div class="label">
                Email
            </div>

            <div
                class="value"
                id="studentEmail"
            >
                ---
            </div>

        </div>


        <div class="info">

            <div class="label">
                Class
            </div>

            <div class="value">
                12th
            </div>

        </div>


        <div class="info">

            <div class="label">
                Stream
            </div>

            <div class="value">
                Science
            </div>

        </div>


        <div class="info">

            <div class="label">
                Account Status
            </div>

            <div class="value">
                ✅ Active
            </div>

        </div>

    </div>

</div>


<a class="back" href="dashboard.html">
    ← Back to Dashboard
</a>


<script>

/* ================= LOGIN CHECK ================= */

if (
    localStorage.getItem("studentLoggedIn")
    !== "true"
) {

    alert("Please Student Login karein.");

    window.location.href =
        "login.html";

}


/* ================= STUDENT DATA ================= */

document.getElementById("studentName").innerText =
    localStorage.getItem("studentName")
    || "Student";


document.getElementById("studentID").innerText =
    localStorage.getItem("studentID")
    || "---";


document.getElementById("studentEmail").innerText =
    localStorage.getItem("studentEmail")
    || "---";


/* ================= PROFILE PHOTO ================= */

let studentID =
    localStorage.getItem("studentID");


let savedPhoto =
    localStorage.getItem(
        "profilePhoto_" + studentID
    );


let photo =
    document.getElementById("profilePhoto");


if (savedPhoto) {

    photo.src = savedPhoto;

} else {

    photo.src =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="120"
             height="120"
             viewBox="0 0 120 120">

            <circle
                cx="60"
                cy="60"
                r="58"
                fill="#eef5ff"/>

            <text
                x="60"
                y="72"
                text-anchor="middle"
                font-size="55">
                👨‍🎓
            </text>

        </svg>
        `);

}


/* ================= SELECT PHOTO ================= */

document.getElementById("photoInput")
.addEventListener("change", function(event) {

    let file =
        event.target.files[0];


    if (!file) {
        return;
    }


    /* IMAGE CHECK */

    if (!file.type.startsWith("image/")) {

        alert(
            "❌ Sirf image select karein."
        );

        return;

    }


    /* SIZE CHECK */

    if (file.size > 2 * 1024 * 1024) {

        alert(
            "❌ Image 2 MB se chhoti honi chahiye."
        );

        return;

    }


    let reader =
        new FileReader();


    reader.onload = function(e) {

        let imageData =
            e.target.result;


        photo.src =
            imageData;


        localStorage.setItem(
            "profilePhoto_" + studentID,
            imageData
        );


        alert(
            "Profile Picture Saved! ✅"
        );

    };


    reader.readAsDataURL(file);

});


/* ================= REMOVE PHOTO ================= */

function removePhoto() {

    if (
        !confirm(
            "Kya profile picture remove karni hai?"
        )
    ) {
        return;
    }


    localStorage.removeItem(
        "profilePhoto_" + studentID
    );


    location.reload();

}

</script>

</body>
</html>
