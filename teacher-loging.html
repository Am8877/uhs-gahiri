<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Login - UHS GAHIRI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
}

.login-box {
    width: 90%;
    max-width: 380px;
    background: white;
    margin: 70px auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #bbb;
    box-sizing: border-box;
}

h1 {
    text-align: center;
    color: #0757a0;
}

h2 {
    text-align: center;
    color: #333;
}

p {
    text-align: center;
    color: #555;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 7px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: #0757a0;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
}

.error {
    display: none;
    margin-top: 15px;
    padding: 10px;
    background: #f8d7da;
    color: #721c24;
    border-radius: 6px;
    text-align: center;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #0757a0;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="login-box">

<h1>UHS GAHIRI</h1>

<h2>👨‍🏫 Teacher Login</h2>

<p>Login with your Teacher ID</p>

<form id="teacherLoginForm">

<label>Teacher ID</label>

<input
type="text"
id="teacherId"
placeholder="Example: T001"
required
>

<label>Password</label>

<input
type="password"
id="teacherPassword"
placeholder="Enter Password"
required
>

<button type="submit">
🔐 Teacher Login
</button>

</form>

<div class="error" id="loginError">
❌ Teacher ID या Password गलत है!
</div>

<a class="back" href="index.html">
← Back to Home
</a>

</div>


<script>

document.getElementById(
    "teacherLoginForm"
).addEventListener(
"submit",
function(event) {

    event.preventDefault();


    let teacherId =
        document.getElementById(
            "teacherId"
        ).value.trim();


    let password =
        document.getElementById(
            "teacherPassword"
        ).value;


    /* GET TEACHERS */

    let teachers =
        JSON.parse(
            localStorage.getItem(
                "schoolTeachers"
            )
        ) || [];


    /* FIND TEACHER */

    let teacher =
        teachers.find(function(item) {

            return (
                item.teacherId === teacherId &&
                item.password === password
            );

        });


    if (teacher) {

        /* SAVE LOGIN */

        localStorage.setItem(
            "teacherLoggedIn",
            "true"
        );

        localStorage.setItem(
            "teacherId",
            teacher.teacherId
        );

        localStorage.setItem(
            "teacherName",
            teacher.name
        );

        localStorage.setItem(
            "teacherEmail",
            teacher.email
        );


        alert(
            "Teacher Login Successful! ✅"
        );


        window.location.href =
            "teacher-dashboard.html";


    } else {

        document.getElementById(
            "loginError"
        ).style.display = "block";

    }

});

</script>

</body>
</html>
