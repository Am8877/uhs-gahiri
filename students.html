<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Students - UHS GAHIRI</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef5ff;
}

header{
    background:#333;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0 0 10px;
}

header p{
    margin:0;
    font-size:18px;
}

.container{
    width:94%;
    max-width:800px;
    margin:25px auto;
}

.container h2{
    font-size:30px;
}

.card{
    background:white;
    margin-bottom:15px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px #ccc;
}

.student-name{
    font-size:21px;
    font-weight:bold;
    color:#0757a0;
    margin-bottom:12px;
}

.info{
    margin-top:8px;
    color:#555;
    line-height:1.5;
}

.delete{
    margin-top:15px;
    padding:10px 16px;
    background:#d32f2f;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.empty{
    background:white;
    padding:30px 20px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 3px 10px #ccc;
}

.loading{
    background:white;
    padding:30px;
    text-align:center;
    border-radius:12px;
}

.error{
    background:#f8d7da;
    color:#721c24;
    padding:15px;
    border-radius:8px;
    text-align:center;
}

.back{
    display:block;
    width:240px;
    margin:25px auto;
    padding:13px;
    background:#333;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:7px;
    font-weight:bold;
}

</style>

</head>

<body>

<header>

<h1>UHS GAHIRI</h1>

<p>👨‍🎓 Student Management</p>

</header>


<div class="container">

<h2>Registered Students</h2>

<div id="studentList">

<div class="loading">
⏳ Students loading...
</div>

</div>

</div>


<a class="back"
href="admin-dashboard.html">

← Back to Principal Dashboard

</a>


<script>

/* =====================================
   SUPABASE CONFIGURATION
===================================== */

const SUPABASE_URL =
"https://rdnficdoftkfgveidykh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3RaikJM0PVKpghxxNhMK3Q_T2FAebwj";


/* =====================================
   ADMIN LOGIN CHECK
===================================== */

if(
    localStorage.getItem("adminLoggedIn")
    !== "true"
){

    alert("Please Principal Login karein.");

    window.location.href =
    "admin-login.html";

}


/* =====================================
   LOAD STUDENTS FROM SUPABASE
===================================== */

async function loadStudents(){

    const list =
    document.getElementById("studentList");

    list.innerHTML = `
        <div class="loading">
            ⏳ Students loading...
        </div>
    `;


    try{

        const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/students?select=*",
            {

                method:"GET",

                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                    "Bearer " + SUPABASE_KEY
                }

            }
        );


        if(!response.ok){

            const errorText =
            await response.text();

            throw new Error(errorText);

        }


        const students =
        await response.json();


        list.innerHTML="";


        if(
            !students ||
            students.length===0
        ){

            list.innerHTML=`

                <div class="empty">

                    <h3>
                    👨‍🎓 No Students
                    </h3>

                    <p>
                    Abhi tak koi student
                    registered nahi hai.
                    </p>

                </div>

            `;

            return;

        }


        students.forEach(
        function(student){

            const div =
            document.createElement("div");

            div.className="card";


            /* DATABASE COLUMN NAMES */

            const name =
            student.name || "N/A";

            const studentId =
            student.student_id ||
            student.studentId ||
            "N/A";

            const email =
            student.email || "N/A";

            const mobile =
            student.mobile || "N/A";

            const studentClass =
            student.student_class ||
            student.studentClass ||
            "N/A";

            const stream =
            student.student_stream ||
            student.studentStream ||
            "";


            div.innerHTML=`

                <div class="student-name">

                    👨‍🎓 ${name}

                </div>


                <div class="info">

                    🆔 Student ID:
                    <b>${studentId}</b>

                </div>


                <div class="info">

                    📱 Mobile:
                    ${mobile}

                </div>


                <div class="info">

                    📧 Email:
                    ${email}

                </div>


                <div class="info">

                    🏫 Class:
                    ${studentClass}

                </div>


                ${
                    stream
                    ?
                    `
                    <div class="info">

                        📚 Stream:
                        ${stream}

                    </div>
                    `
                    :
                    ""
                }


                <button
                class="delete"
                onclick='deleteStudent("${student.id || ""}")'>

                🗑️ Delete Student

                </button>

            `;


            list.appendChild(div);

        });


    }

    catch(error){

        console.error(error);

        list.innerHTML=`

            <div class="error">

                ❌ Students load nahi ho rahe.

                <br><br>

                Database connection
                check karein.

            </div>

        `;

    }

}


/* =====================================
   DELETE STUDENT
===================================== */

async function deleteStudent(id){

    if(!id){

        alert(
        "Student ID database me nahi mila."
        );

        return;

    }


    const confirmDelete =
    confirm(
    "Kya aap is student ko delete karna chahte hain?"
    );


    if(!confirmDelete){

        return;

    }


    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/students?id=eq." +
            encodeURIComponent(id),

            {

                method:"DELETE",

                headers:{

                    "apikey":SUPABASE_KEY,

                    "Authorization":
                    "Bearer " + SUPABASE_KEY,

                    "Content-Type":
                    "application/json",

                    "Prefer":
                    "return=minimal"

                }

            }

        );


        if(!response.ok){

            const errorText =
            await response.text();

            throw new Error(errorText);

        }


        alert(
        "Student successfully delete ho gaya. ✅"
        );


        loadStudents();

    }


    catch(error){

        console.error(error);

        alert(
        "Student delete nahi hua. ❌"
        );

    }

}


/* =====================================
   START
===================================== */

loadStudents();

</script>

</body>
</html>
